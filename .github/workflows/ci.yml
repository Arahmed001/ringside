name: CI

# Minutes matter: this repository is private, so Actions minutes are metered (2,000 a month on the free plan), and several sessions push at once. What keeps the bill down:
#  - a newer push to the same pull request cancels the older run;
#  - a change to Markdown and docs/ only runs the one test that reads them (tests/config-docs.test.ts), not the build, the smoke tests or the image;
#  - the image is built only on main, or when something that can change it changed;
#  - the dependency audit runs on main, or when the package files changed;
#  - the five extra smoke variants (sparse, empty, unknown facts, partial, hostile) run on main; a pull request runs the default smoke;
#  - the Next build cache is kept between runs;
#  - the tests, the type check and lint, and the build and smoke tests run as parallel jobs, and `verify` (the check to require) waits for all of them.
# Everything runs on main in full, whatever the change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docker: ${{ steps.classify.outputs.docker }}
      deps: ${{ steps.classify.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
      - name: Which files changed
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename' 2>/dev/null || echo "(unknown)")
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" -q '.files[].filename' 2>/dev/null || echo "(unknown)")
          else
            files="(unknown)"
          fi
          printf '%s\n' "$files" | node scripts/ci-changes.mjs | tee -a "$GITHUB_OUTPUT"

  # `verify` is the one check a pull request waits on (and the name branch protection can require). It does no work of its own except for a docs-only change; it
  # waits for the parallel jobs below and fails unless every one of them passed (or was skipped because the change is docs only). The work is split so a run takes as
  # long as the slowest part, not the sum: the tests (about 7 of the 9 minutes on a two-core runner) are the one test suite cut into SHARDS equal-time pieces
  # (scripts/ci-test-shard.mjs; tests/ci-workflow.test.ts pins that every test file runs in exactly one piece), beside the type check and lint, and the build and smoke tests.
  static:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # node:sqlite needs 22.5+
          cache: npm
      - run: npm ci
      - name: Generate route types
        run: npx next typegen # LayoutProps, PageProps and next/root-params types are generated, not checked in
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Demo feed passes data validation
        run: npm run data:check
        env:
          RINGSIDE_NOW: "2026-10-03"

  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 15
    strategy:
      fail-fast: false # every piece reports, so one failure does not hide another
      matrix:
        shard: [1, 2, 3] # as many entries as SHARDS (pinned by tests/ci-workflow.test.ts)
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SHARDS: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (piece ${{ matrix.shard }} of ${{ env.SHARDS }})
        # the same command as `npm test`, on this piece's files, with as many test files at once as the runner has cores (node's default is one fewer, which on a two-core runner is one)
        run: |
          files=$(node scripts/ci-test-shard.mjs "${{ matrix.shard }}" "$SHARDS")
          echo "$files" | wc -l
          node --import tsx --test --test-concurrency="$(nproc)" $files

  build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Production build
        run: npm run build
      - name: Smoke test (every kind of page, both languages, on a production server)
        run: npm run smoke
      - name: Smoke test on a league with nothing upcoming, one with no data at all, one with many facts unknown, a partial first load (supplier totals shown), and a hostile one (awkward values; markup in a name must never be on a page unescaped)
        if: github.event_name != 'pull_request'
        run: npm run smoke -- --feed sparse && npm run smoke -- --feed empty && npm run smoke -- --facts unknown && npm run smoke -- --feed partial && npm run smoke -- --feed hostile --crawl 60

  verify:
    needs: [changes, static, tests, build]
    if: always()
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: env.DOCS_ONLY == 'true'
      - uses: actions/setup-node@v7
        if: env.DOCS_ONLY == 'true'
        with:
          node-version: 22 # node:sqlite needs 22.5+
          cache: npm
      - run: npm ci
        if: env.DOCS_ONLY == 'true'
      - name: Docs-only change - the one test that reads the docs (every setting they mention is one the code reads)
        if: env.DOCS_ONLY == 'true'
        run: node --import tsx --test tests/config-docs.test.ts
      - name: Every part passed (a docs-only change skips the type check, lint, tests, build and smoke tests; nothing else may be skipped, cancelled or failed)
        if: always()
        env:
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES static=$STATIC tests=$TESTS build=$BUILD docs_only=$DOCS_ONLY"
          [ "$CHANGES" = success ] || { echo "the change classifier did not succeed"; exit 1; }
          if [ "$DOCS_ONLY" = true ]; then want=skipped; else want=success; fi
          for r in "$STATIC" "$TESTS" "$BUILD"; do
            [ "$r" = "$want" ] || { echo "expected $want, got $r"; exit 1; }
          done

  docker:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t ringside .
      - name: Run it against an empty volume and wait for the health check
        run: |
          docker volume create ringside-data
          docker run -d --name ringside -p 3000:3000 -v ringside-data:/data ringside
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          cat /tmp/health.json; echo
          [ "$code" = 200 ] || { docker logs ringside; exit 1; }
          curl -fsS http://127.0.0.1:3000/ -o /dev/null
          docker exec ringside npm run model:fit > /dev/null
          docker exec ringside test -s /data/model-fit.json  # the fit lands in the volume, not the image layer
          docker exec ringside test -s /data/ringside.db
          [ "$(docker exec ringside id -u)" != 0 ] || { echo "container runs as root"; exit 1; }
      - name: Server log
        if: always()
        run: docker logs ringside || true

  audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 5
    continue-on-error: true # new advisories shouldn't block unrelated changes; check the result when it turns red
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
