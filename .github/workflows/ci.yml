name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # node:sqlite needs 22.5+
          cache: npm
      - run: npm ci
      - name: Generate route types
        run: npx next typegen # LayoutProps, PageProps and next/root-params types are generated, not checked in
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Demo feed passes data validation
        run: npm run data:check
        env:
          RINGSIDE_NOW: "2026-10-03"
      - name: Production build
        run: npm run build
      - name: Smoke test (every kind of page, both languages, on a production server)
        run: npm run smoke
      - name: Smoke test on a league with nothing upcoming, one with no data at all, one with many facts unknown, and a partial first load (supplier totals shown)
        run: npm run smoke -- --feed sparse && npm run smoke -- --feed empty && npm run smoke -- --facts unknown && npm run smoke -- --feed partial

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t ringside .
      - name: Run it against an empty volume and wait for the health check
        run: |
          docker volume create ringside-data
          docker run -d --name ringside -p 3000:3000 -v ringside-data:/data ringside
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          cat /tmp/health.json; echo
          [ "$code" = 200 ] || { docker logs ringside; exit 1; }
          curl -fsS http://127.0.0.1:3000/ -o /dev/null
          docker exec ringside npm run model:fit > /dev/null
          docker exec ringside test -s /data/model-fit.json  # the fit lands in the volume, not the image layer
          docker exec ringside test -s /data/ringside.db
          [ "$(docker exec ringside id -u)" != 0 ] || { echo "container runs as root"; exit 1; }
      - name: Server log
        if: always()
        run: docker logs ringside || true

  audit:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 5
    continue-on-error: true # new advisories shouldn't block unrelated changes; check the result when it turns red
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
